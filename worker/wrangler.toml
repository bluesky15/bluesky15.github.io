name = "onlinelkb-login"
main = "src/index.js"
compatibility_date = "2025-11-01"

# Page templates (worker/src/pages/*.html) are imported as strings
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# These three paths are handled by this Worker. Trailing * keeps requests with
# query strings (?error=1 etc.) inside the worker — an exact pattern like
# "onlinelkb.in/login" does NOT match "/login?query" and lets the request
# fall through to the GitHub Pages origin (observed live, 404).
routes = [
  { pattern = "onlinelkb.in/login*",  zone_name = "onlinelkb.in" },
  { pattern = "onlinelkb.in/hello*",  zone_name = "onlinelkb.in" },
  { pattern = "onlinelkb.in/logout*", zone_name = "onlinelkb.in" },
  { pattern = "onlinelkb.in/api/entries*", zone_name = "onlinelkb.in" },
  { pattern = "onlinelkb.in/img/*", zone_name = "onlinelkb.in" },
]

[[d1_databases]]
binding = "DB"
database_name = "lkb-auth"
database_id = "5d1f8e81-2085-4886-8b41-ffede7a5a9d6"

[[kv_namespaces]]
binding = "MEDIA"
id = "f1d4e647dd76490f98afc831a2d513c7"
